<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TariffAI — Pakistan HS Code Classifier</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Cormorant:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #050510;
    --purple: #7B6EF6;
    --blue: #4FC3F7;
    --text: #F0EEF8;
    --text-dim: #9893B8;
    --glass: rgba(255,255,255,0.04);
    --glass-border: rgba(123,110,246,0.2);
    --glow: rgba(123,110,246,0.15);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Cormorant Garamond', serif;
    overflow-x: hidden;
  }

  /* CANVAS BACKGROUND */
  #bg-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
    pointer-events: none;
  }

  /* MAIN LAYOUT */
  .container {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* HERO */
  .hero {
    text-align: center;
    padding: 80px 0 48px;
    opacity: 0;
    animation: fadeUp 1s cubic-bezier(0.16,1,0.3,1) 0.3s forwards;
  }

  .hero-badge {
    display: inline-block;
    font-family: 'Cormorant Garamond', serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--purple);
    border: 1px solid rgba(123,110,246,0.3);
    padding: 6px 16px;
    border-radius: 100px;
    margin-bottom: 28px;
    background: rgba(123,110,246,0.08);
  }

  .hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(52px, 8vw, 88px);
    font-weight: 300;
    line-height: 1.0;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #F0EEF8 0%, #7B6EF6 50%, #4FC3F7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
  }

  .hero p {
    font-size: 18px;
    font-weight: 300;
    color: var(--text-dim);
    letter-spacing: 0.01em;
    line-height: 1.6;
  }

  /* SEARCH SECTION */
  .search-section {
    opacity: 0;
    animation: fadeUp 1s cubic-bezier(0.16,1,0.3,1) 0.6s forwards;
  }

  .search-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 32px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 60px var(--glow), inset 0 1px 0 rgba(255,255,255,0.05);
    transition: box-shadow 0.4s ease;
  }

  .search-card:focus-within {
    box-shadow: 0 0 80px rgba(123,110,246,0.25), 0 0 120px rgba(79,195,247,0.1), inset 0 1px 0 rgba(255,255,255,0.08);
    border-color: rgba(123,110,246,0.4);
  }

  .search-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 14px;
    display: block;
  }

  .search-input {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(123,110,246,0.15);
    border-radius: 12px;
    padding: 18px 22px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 300;
    color: var(--text);
    outline: none;
    transition: all 0.3s ease;
    margin-bottom: 16px;
  }

  .search-input::placeholder { color: rgba(240,238,248,0.25); }

  .search-input:focus {
    border-color: rgba(123,110,246,0.5);
    background: rgba(123,110,246,0.05);
    box-shadow: 0 0 0 3px rgba(123,110,246,0.1);
  }

  .search-row {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  .api-input {
    flex: 1;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 12px 16px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 14px;
    color: var(--text-dim);
    outline: none;
    transition: all 0.3s ease;
  }

  .api-input:focus {
    border-color: rgba(123,110,246,0.3);
    color: var(--text);
  }

  .api-input::placeholder { color: rgba(240,238,248,0.2); font-size: 13px; }

  .search-btn {
    background: linear-gradient(135deg, var(--purple), var(--blue));
    border: none;
    border-radius: 12px;
    padding: 14px 32px;
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-weight: 500;
    color: #fff;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
    box-shadow: 0 4px 24px rgba(123,110,246,0.4);
    white-space: nowrap;
    letter-spacing: 0.03em;
  }

  .search-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(123,110,246,0.5);
  }

  .search-btn:active { transform: translateY(0); }

  .search-btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  /* LOADING */
  .loading {
    display: none;
    text-align: center;
    padding: 48px 0;
  }

  .loading.show { display: block; }

  .loading-dots {
    display: inline-flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .loading-dots span {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--purple);
    animation: dotPulse 1.2s ease-in-out infinite;
  }

  .loading-dots span:nth-child(2) { animation-delay: 0.2s; background: #9B8EF8; }
  .loading-dots span:nth-child(3) { animation-delay: 0.4s; background: var(--blue); }

  .loading p {
    font-size: 16px;
    color: var(--text-dim);
    font-style: italic;
  }

  /* RESULTS */
  .results {
    margin-top: 40px;
  }

  .results-title {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 20px;
    padding-left: 4px;
  }

  .result-card {
    background: var(--glass);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 28px 32px;
    margin-bottom: 16px;
    backdrop-filter: blur(20px);
    opacity: 0;
    transform: translateY(20px);
    animation: cardIn 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
    transition: all 0.3s ease;
    cursor: default;
  }

  .result-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 40px rgba(123,110,246,0.2);
    border-color: rgba(123,110,246,0.35);
  }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 16px;
    gap: 16px;
  }

  .hs-code {
    font-family: 'Cormorant Garamond', serif;
    font-size: 36px;
    font-weight: 300;
    background: linear-gradient(135deg, var(--purple), var(--blue));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.02em;
    line-height: 1;
  }

  .confidence-badge {
    background: rgba(123,110,246,0.12);
    border: 1px solid rgba(123,110,246,0.2);
    border-radius: 100px;
    padding: 6px 14px;
    font-size: 13px;
    color: var(--purple);
    font-weight: 500;
    white-space: nowrap;
  }

  .card-desc {
    font-size: 20px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 12px;
    line-height: 1.4;
  }

  .card-meta {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }

  .meta-item {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .meta-label {
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    font-weight: 500;
  }

  .meta-value {
    font-size: 16px;
    color: var(--text);
    font-weight: 300;
  }

  .duty-value {
    color: #69F0AE;
    font-weight: 500;
  }

  /* CONFIDENCE BAR */
  .confidence-bar-wrap {
    margin-top: 20px;
    height: 3px;
    background: rgba(255,255,255,0.06);
    border-radius: 100px;
    overflow: hidden;
  }

  .confidence-bar {
    height: 100%;
    border-radius: 100px;
    background: linear-gradient(90deg, var(--purple), var(--blue));
    width: 0%;
    transition: width 0.8s cubic-bezier(0.16,1,0.3,1);
  }

  /* ERROR */
  .error-card {
    background: rgba(255,80,80,0.06);
    border: 1px solid rgba(255,80,80,0.2);
    border-radius: 16px;
    padding: 24px 28px;
    color: #FF8080;
    font-size: 17px;
  }

  /* FOOTER */
  .footer {
    text-align: center;
    margin-top: 60px;
    padding-top: 32px;
    border-top: 1px solid rgba(255,255,255,0.05);
    font-size: 13px;
    color: rgba(152,147,184,0.5);
    letter-spacing: 0.05em;
  }

  /* ANIMATIONS */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes dotPulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  @media (max-width: 600px) {
    .hero { padding: 60px 0 36px; }
    .search-card { padding: 24px 20px; }
    .search-row { flex-direction: column; }
    .search-btn { width: 100%; }
    .card-top { flex-direction: column; }
    .hs-code { font-size: 28px; }
  }
</style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="container">
  <div class="hero">
    <div class="hero-badge">Pakistan Customs Tariff · PCT 2017–18</div>
    <h1>TariffAI</h1>
    <p>Describe any product — get the correct HS Code instantly.<br>Powered by AI, built for Pakistan's export sector.</p>
  </div>

  <div class="search-section">
    <div class="search-card">
      <label class="search-label">Product Description</label>
      <input
        type="text"
        class="search-input"
        id="productInput"
        placeholder="e.g. leather football size 5, polyester men's shirt, surgical scissors..."
        autocomplete="off"
      />
      <div class="search-row">
        <input
          type="password"
          class="api-input"
          id="apiKey"
          placeholder="Enter Gemini API Key (AIza...)"
        />
        <button class="search-btn" id="searchBtn" onclick="classify()">
          Classify →
        </button>
      </div>
    </div>
  </div>

  <div class="loading" id="loading">
    <div class="loading-dots">
      <span></span><span></span><span></span>
    </div>
    <p>Searching Pakistan Customs Tariff...</p>
  </div>

  <div class="results" id="results"></div>

  <div class="footer">
    TariffAI · Pakistan Customs Tariff 2017–18 · Built for Sialkot's export sector
  </div>
</div>

<script>
// =====================
// BACKGROUND ANIMATION
// =====================
const canvas = document.getElementById('bg-canvas');
const ctx = canvas.getContext('2d');

let W, H, dots = [];
const COLORS = ['rgba(123,110,246,', 'rgba(79,195,247,', 'rgba(180,170,255,'];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}

function initDots() {
  dots = [];
  const count = Math.floor((W * H) / 12000);
  for (let i = 0; i < count; i++) {
    dots.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      r: Math.random() * 1.8 + 0.5,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
      opacity: Math.random() * 0.6 + 0.2
    });
  }
}

function drawFrame() {
  ctx.clearRect(0, 0, W, H);

  // Draw connections
  for (let i = 0; i < dots.length; i++) {
    for (let j = i + 1; j < dots.length; j++) {
      const dx = dots[i].x - dots[j].x;
      const dy = dots[i].y - dots[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < 130) {
        const alpha = (1 - dist / 130) * 0.12;
        ctx.beginPath();
        ctx.moveTo(dots[i].x, dots[i].y);
        ctx.lineTo(dots[j].x, dots[j].y);
        ctx.strokeStyle = `rgba(123,110,246,${alpha})`;
        ctx.lineWidth = 0.6;
        ctx.stroke();
      }
    }
  }

  // Draw dots
  dots.forEach(d => {
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = d.color + d.opacity + ')';
    ctx.fill();

    // Glow
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r * 3, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(d.x, d.y, 0, d.x, d.y, d.r * 3);
    grad.addColorStop(0, d.color + (d.opacity * 0.3) + ')');
    grad.addColorStop(1, d.color + '0)');
    ctx.fillStyle = grad;
    ctx.fill();

    // Move
    d.x += d.vx;
    d.y += d.vy;
    if (d.x < 0 || d.x > W) d.vx *= -1;
    if (d.y < 0 || d.y > H) d.vy *= -1;
  });

  requestAnimationFrame(drawFrame);
}

window.addEventListener('resize', () => { resize(); initDots(); });
resize();
initDots();
drawFrame();

// =====================
// CLASSIFIER LOGIC
// =====================
async function classify() {
  const product = document.getElementById('productInput').value.trim();
  const apiKey = document.getElementById('apiKey').value.trim();
  const btn = document.getElementById('searchBtn');
  const loading = document.getElementById('loading');
  const results = document.getElementById('results');

  if (!product) {
    document.getElementById('productInput').focus();
    return;
  }

  if (!apiKey) {
    results.innerHTML = `<div class="error-card">Please enter your Gemini API key above. Get it free from aistudio.google.com</div>`;
    return;
  }

  btn.disabled = true;
  loading.classList.add('show');
  results.innerHTML = '';

  const prompt = `You are a Pakistan Customs Tariff expert. A user wants to find the correct HS/PCT code for their product.

Product: "${product}"

Based on Pakistan Customs Tariff (PCT) 2017-18, classify this product and return ONLY valid JSON in this exact format, no other text:

{
  "results": [
    {
      "hs_code": "XXXX.XXXX",
      "description": "Official tariff description",
      "chapter": "Chapter number and title",
      "duty_rate": "XX%",
      "confidence": 95,
      "notes": "Brief classification note explaining why this code applies"
    }
  ]
}

Rules:
- Return 1 to 3 results maximum, ordered by confidence (highest first)
- hs_code must be real PCT code in format XXXX.XXXX or XXXX.XXXXXX
- confidence is 0-100 integer
- If product could be knitted or woven, list both
- Consider man-made fibres vs natural fibres
- For Sialkot exports: sports goods (Ch 95), surgical instruments (Ch 90), leather goods (Ch 42), textiles (Ch 61-62)
- Return ONLY the JSON object, nothing else`;

  try {
    const response = await fetch(
      `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`,
      {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [{ text: prompt }] }],
          generationConfig: {
            temperature: 0.1,
            maxOutputTokens: 1000
          }
        })
      }
    );

    const data = await response.json();

    if (data.error) {
      throw new Error(data.error.message);
    }

    const text = data.candidates[0].content.parts[0].text.trim();
    const clean = text.replace(/```json|```/g, '').trim();
    const parsed = JSON.parse(clean);

    loading.classList.remove('show');
    btn.disabled = false;

    if (!parsed.results || parsed.results.length === 0) {
      results.innerHTML = `<div class="error-card">No matching HS code found. Try a more specific description.</div>`;
      return;
    }

    results.innerHTML = `<div class="results-title">Classification Results — ${parsed.results.length} match${parsed.results.length > 1 ? 'es' : ''} found</div>`;

    parsed.results.forEach((r, i) => {
      const card = document.createElement('div');
      card.className = 'result-card';
      card.style.animationDelay = `${i * 0.12}s`;
      card.innerHTML = `
        <div class="card-top">
          <div class="hs-code">${r.hs_code}</div>
          <div class="confidence-badge">${r.confidence}% match</div>
        </div>
        <div class="card-desc">${r.description}</div>
        <div class="card-meta">
          <div class="meta-item">
            <span class="meta-label">Chapter</span>
            <span class="meta-value">${r.chapter}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">Import Duty</span>
            <span class="meta-value duty-value">${r.duty_rate}</span>
          </div>
        </div>
        ${r.notes ? `<div style="margin-top:14px;font-size:15px;color:var(--text-dim);font-style:italic;line-height:1.5">${r.notes}</div>` : ''}
        <div class="confidence-bar-wrap">
          <div class="confidence-bar" id="bar-${i}"></div>
        </div>
      `;
      results.appendChild(card);

      setTimeout(() => {
        const bar = document.getElementById(`bar-${i}`);
        if (bar) bar.style.width = r.confidence + '%';
      }, 300 + i * 120);
    });

  } catch (err) {
    loading.classList.remove('show');
    btn.disabled = false;
    results.innerHTML = `<div class="error-card">Error: ${err.message}</div>`;
  }
}

// Enter key support
document.getElementById('productInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') classify();
});

// Save API key automatically when user types it
document.getElementById('apiKey').addEventListener('change', e => {
  if (e.target.value.trim()) {
    localStorage.setItem('gemini_api_key', e.target.value.trim());
  }
});

// Load saved key on page open
window.addEventListener('load', () => {
  const saved = localStorage.getItem('gemini_api_key');
  if (saved) {
    document.getElementById('apiKey').value = saved;
  }
});
</script>
</body>
</html>
